name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level default. Each job may narrow or expand this; jobs that need
# write scopes (artifact uploads) opt in explicitly below.
permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: read
    name: Format, Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so commitlint can traverse the PR range
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-${{ hashFiles('src/**/*.{ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit — production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Security audit — all dependencies
        run: npm audit --audit-level=high

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks posts a summary comment on PRs that introduce findings.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks scans every commit, not just the tip
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE only needed if this repo moves to an org account.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-${{ hashFiles('src/**/*.{ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Run tests
        run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, coverage]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-${{ hashFiles('src/**/*.{ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        run: npm run build
        # A production build requires explicit public envs (src/lib/env.ts).
        # APP_URL must match the Playwright baseURL — the e2e job serves this artifact.
        env:
          NEXT_PUBLIC_APP_NAME: My App
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_API_ORIGIN: https://jsonplaceholder.typicode.com

      - name: Verify and package build output
        run: |
          if [ ! -d ".next" ]; then
            echo "::error::Next.js build output directory (.next) was not created. Check the build logs above for compilation errors."
            exit 1
          fi

          FILE_COUNT=$(find .next -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Build directory .next/ exists but contains no files."
            exit 1
          fi

          echo "✅ Build output verified: $FILE_COUNT files in .next/"
          ls -la .next/

          echo "Packaging build artifact..."
          tar -czf next-build.tar.gz .next/
          echo "Artifact size: $(du -sh next-build.tar.gz | cut -f1)"

      - name: Analyse bundle size
        continue-on-error: true
        run: |
          echo "## Bundle size" >> $GITHUB_STEP_SUMMARY
          du -sh .next/static/chunks/*.js 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.gz
          if-no-files-found: error
          retention-days: 7

  storybook:
    name: Storybook (build + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Fail-fast: if the Storybook app does not compile, skip the browser run.
      - name: Build Storybook
        run: npm run storybook:build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Storybook a11y tests
        run: npm run test:storybook
        env:
          # Match the local pre-push budget; the browser project is memory-hungry.
          NODE_OPTIONS: '--max-old-space-size=4096'

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Extract build artifact
        run: tar -xzf next-build.tar.gz

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

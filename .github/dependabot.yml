version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - '*'
    ignore:
      # TODO: drop once eslint-plugin-import supports ESLint 10 (it caps at ^9,
      # so a major bump breaks npm ci). See README → Important Notes (ESLint v9 pin).
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'
